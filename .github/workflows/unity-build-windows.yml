name: Build Unity Project

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.devtool/features/**'
      - '.vscode/**'

jobs:
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64

    steps:
      # 1. Checkout
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false

      # 2. Restore ignored NuGetForUnity packages (R3, etc.) before .NET is deleted
      - name: Restore NuGetForUnity packages
        run: |
          dotnet tool restore
          dotnet nugetforunity restore .
          ls -la Assets/Packages

      # 3. Show disk space before cleanup (debug, optional but useful)
      - name: Disk space before cleanup
        run: df -h

      # 4. FREE DISK SPACE (this is the critical fix)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af

      # 5. Show disk space after cleanup (debug)
      - name: Disk space after cleanup
        run: df -h

      # 6. Unity 6.6 Windows/mac images get SIGKILL (exit 137) on 16GB runners with no swap
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=80
          free -h
          swapon --show

      - name: Read Unity version
        id: unity
        run: |
          ver="$(awk '/m_EditorVersion:/{print $2; exit}' ProjectSettings/ProjectVersion.txt)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # 7. Cache Unity Library
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ steps.unity.outputs.version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-${{ steps.unity.outputs.version }}-

      # 8. Build with Unity
      - uses: game-ci/unity-builder@v5
        id: buildStep
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          versioning: Semantic

      # 9. Upload build artifact
      - uses: actions/upload-artifact@v7
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
